<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhadkan | Admin Fleet Commander</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-glass: rgba(255, 255, 255, 0.04);
            --border-glass: rgba(255, 255, 255, 0.08);
            --brand-red: #ef4444;
            --brand-green: #10b981;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-glass);
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: var(--brand-red);
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            padding: 15px 25px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card strong {
            font-size: 1.8rem;
            font-weight: 800;
            display: block;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .driver-card {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .driver-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.15);
        }

        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .badge.approved { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }

        .driver-card h3 { margin: 0 0 5px 0; font-size: 1.3rem; }
        .driver-card p { margin: 0 0 15px 0; color: rgba(255,255,255,0.6); font-size: 0.9rem; }

        .details {
            border-top: 1px solid var(--border-glass);
            padding-top: 15px;
            margin-bottom: 20px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .detail-item span { color: rgba(255,255,255,0.5); }
        .detail-item strong { color: #fff; }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Outfit';
            text-align: center;
            text-decoration: none;
        }

        .btn-approve { background: var(--brand-green); color: #fff; }
        .btn-approve:hover { background: #059669; }

        .btn-revoke { background: rgba(239, 68, 68, 0.1); color: var(--brand-red); border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-revoke:hover { background: rgba(239, 68, 68, 0.2); }

        /* Password Overlay */
        #lockOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: var(--bg-dark); z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        #lockOverlay input {
            padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: #fff; text-align: center; font-size: 1.2rem;
            letter-spacing: 4px; font-family: 'Outfit'; margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Simple Pin Lock -->
    <div id="lockOverlay" style="position:fixed; top:0; left:0; width:100%; height:100vh; background:#0f172a; z-index:99999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); padding:40px; border-radius:24px; max-width:350px; width:100%; text-align:center;">
            <h2 style="margin: 0 0 15px 0;">Dhadkan Admin</h2>
            <p style="color:rgba(255,255,255,0.6); margin-bottom:20px; font-size:0.9rem;">Enter Admin Pin Code</p>
            <input type="password" id="pinInput" placeholder="••••" maxlength="4" style="width:100%; padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; text-align:center; font-size:1.5rem; letter-spacing:8px; outline:none; margin-bottom:15px;">
            <p style="color:rgba(255,255,255,0.4); font-size:0.8rem;">Standard Admin Pin: 1234</p>
        </div>
    </div>

    <div class="header">
        <h1><i class="ri-dashboard-3-fill"></i> Fleet Commander</h1>
        <div class="stats">
            <div class="stat-card">
                <span>Total Drivers</span>
                <strong id="totalCount">0</strong>
            </div>
            <div class="stat-card">
                <span>Pending</span>
                <strong id="pendingCount" style="color: #f59e0b;">0</strong>
            </div>
        </div>
    </div>

    <div class="grid" id="driverGrid">
        <!-- Render cards live here -->
    </div>

    <!-- Firebase SDK Setup -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAvUbnpjTS-g0reifAS350MeziVH4RWJPY",
          projectId: "dhadkan-travels"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Pin Lock Handling
        const pinInput = document.getElementById('pinInput');
        const lockOverlay = document.getElementById('lockOverlay');
        
        // AUTO ADVANCE PIN OVERLAY
        if (pinInput) {
            pinInput.addEventListener('input', () => {
                if (pinInput.value === '1234') {
                    if (lockOverlay) lockOverlay.style.display = 'none';
                    loadDrivers();
                }
            });
        }

        function loadDrivers() {
            db.collection('drivers').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                const grid = document.getElementById('driverGrid');
                if(!grid) return;
                
                grid.innerHTML = '';
                let pending = 0;
                let total = snapshot.size;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    if (data.approved === false) pending++;

                    const card = document.createElement('div');
                    card.className = 'driver-card';
                    card.innerHTML = `
                        <div class="badge ${data.approved ? 'approved' : 'pending'}">${data.approved ? 'APPROVED' : 'PENDING'}</div>
                        <h3>${data.fullName || 'Driver'}</h3>
                        <p><i class="ri-phone-fill"></i> ${data.phone || 'N/A'}</p>
                        
                        <div class="details">
                            <div class="detail-item"><span>Vehicle Profile</span> <strong>${data.vehicle ? data.vehicle.toUpperCase() : 'N/A'}</strong></div>
                            <div class="detail-item"><span>Registration #</span> <strong>${data.regNumber || 'N/A'}</strong></div>
                            ${data.licenseImage ? `<div class="detail-item"><span>License Proof</span> <a href="${data.licenseImage}" target="_blank" style="color:var(--brand-green); font-weight:600;">View Photo</a></div>` : ''}
                        </div>

                        <div class="actions">
                            ${!data.approved ? `<button class="btn btn-approve" onclick="updateApproval('${id}', true)">Approve Driver</button>` : `<button class="btn btn-revoke" onclick="updateApproval('${id}', false)">Revoke Access</button>`}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                if (document.getElementById('totalCount')) document.getElementById('totalCount').innerText = total;
                if (document.getElementById('pendingCount')) document.getElementById('pendingCount').innerText = pending;
            });
        }

        // Live approval trigger
        window.updateApproval = function(id, status) {
            db.collection('drivers').doc(id).update({
                approved: status
            }).then(() => {
                console.log("Approval State Shifted:", status);
            }).catch(e => {
                alert("Execution error: Enable database writes permissions sitting inside setup");
            });
        }
    </script>
</body>
</html>
